name: Publish Subtly Dungeons

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradlew
        uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build

      - name: detect game version from fabric.mod.json
        id: get-game-version
        run: |
          if [ -f fabric.mod.json ]; then FILE=fabric.mod.json
          elif [ -f src/main/resources/fabric.mod.json ]; then FILE=src/main/resources/fabric.mod.json
          else echo "No fabric.mod.json found" >&2; exit 1
          fi
          ver=$(jq -r '(.depends.minecraft // .minecraft) // empty' "$FILE")
          if [ -z "$ver" ]; then echo "No minecraft version found in $FILE" >&2; exit 1; fi
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: extract changelog for release
        id: changelog
        run: |
          # get tag and strip leading "v"
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          
          cat > /tmp/changelog_awk <<'AWK'
          BEGIN { found = 0 }
            /^## \[/ {
            if (found) exit
          }
          $0 ~ ("^## \\[" ver) {
          found = 1
          print
          next
          }
          if (found) { print }
          AWK
          
          # run awk with the tag variable
          awk -v ver="$tag" -f /tmp/changelog_awk CHANGELOG.md > /tmp/changelog_section || true
          
          if [ ! -s /tmp/changelog_section ]; then
          echo "No changelog found for $tag" >&2
          exit 1
          fi
          
          # set multiline output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog_section >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
                  

      - name: publish mod
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: subtly-dungeons
          curseforge-id: 1363308

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/*.jar
          version-type: release
          changelog: ${{ steps.changelog.outputs.changelog }}
          loaders: fabric
          game-version: ${{ steps.get-game-version.outputs.version }}
          game-versions: |
            - ${{ steps.get-game-version.outputs.version }}
          java: 21

      - name: clean
        run: ./gradlew clean
