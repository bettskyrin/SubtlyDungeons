name: Publish Subtly Dungeons

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: setup gradlew
        uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build

      - name: detect protocol version
        id: get-protocol-version
        run: |
          if [ ! -f gradle.properties ]; then
            echo "Error: gradle.properties not found!" >&2
            exit 1
          fi
          
          VER=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          if [ -z "$VER" ]; then
            echo "Error: minecraft_version key not found in gradle.properties!" >&2
            exit 1
          fi
          
          echo "Detected Game Version: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: read release notes file
        id: changelog
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "Error: RELEASE_NOTES.md not found!" >&2
            exit 1
          fi
          
          {
            echo 'changelog<<EOF'
            cat RELEASE_NOTES.md
            echo ""
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: publish mod
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: subtly-dungeons
          curseforge-id: 1363308

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/!(*-sources).jar
          version-type: release
          changelog: ${{ steps.changelog.outputs.changelog }}
          loaders: fabric
          game-version: ${{ steps.get-protocol-version.outputs.version }}
          game-versions: |
            - ${{ steps.get-game-version.outputs.version }}
          java: 25

      - name: clean
        run: ./gradlew clean